server {
    listen 80;
    server_name _;

    # Re-resolve DNS của Docker mỗi 10 giây — tránh dùng IP cũ sau khi backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # Vite assets có hash trong tên file — cache vĩnh viễn, immutable
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — không cache HTML để SPA luôn nhận version mới nhất
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the backend service
    location /api/ {
        set $backend "backend:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy SignalR websocket
    location /hubs/ {
        set $backend "backend:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

name: CI

# Pipeline toi thieu mo ta trong rules/workflow/deployment.md:
#   1. dotnet build + dotnet test
#   2. frontend: npm ci -> lint -> unit test (vitest) -> type-check (tsc --noEmit) -> build
#   3. build Docker image (chi tren branch chinh / tag)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore backend/BoardGame.sln
      - name: Build
        run: dotnet build backend/BoardGame.sln --no-restore --configuration Release
      - name: Build MinIO for archive integration tests
        # Real archive integration tests use the same source-built MinIO as Compose.
        # The community image is no longer published on Docker Hub.
        run: docker build -t boardgames/minio:2025-10-15 ./infra/minio
      - name: Run backend tests
        run: dotnet test backend/BoardGame.sln --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint + test + type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit test (vitest)
        run: npm run test
        working-directory: frontend
      - name: Build (tsc --noEmit + vite build)
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker image build (smoke test)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t boardgame-backend:ci ./backend/BoardGame.Api
      - name: Build frontend image
        run: docker build -t boardgame-frontend:ci ./frontend

  deploy:
    name: Deploy to production
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Pull latest code
        run: |
          cd /home/taido/boardgame
          git fetch origin master
          git reset --hard origin/master

      - name: Build changed images
        run: |
          cd /home/taido/boardgame
          docker compose -f docker-compose.prod.yml --env-file .env build

      - name: Restart services
        run: |
          cd /home/taido/boardgame
          docker compose -f docker-compose.prod.yml --env-file .env up -d

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 15
          curl -f --retry 5 --retry-delay 5 http://localhost:5173
          echo "Deploy OK — $(date)"
